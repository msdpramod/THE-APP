name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/platform-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify backend
        run: mvn -B verify

  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: theapp_test
          POSTGRES_USER: theapp
          POSTGRES_PASSWORD: theapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U theapp -d theapp_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    defaults:
      run:
        working-directory: backend/platform-api
    env:
      THE_APP_POSTGRES_IT: 'true'
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/theapp_test
      SPRING_DATASOURCE_USERNAME: theapp
      SPRING_DATASOURCE_PASSWORD: theapp
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify PostgreSQL replay safety
        run: mvn -B -Dtest=PostgresDriverMatchingInboxStoreTest test

  backend-kafka:
    runs-on: ubuntu-latest
    services:
      kafka:
        image: apache/kafka:4.0.0
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
          KAFKA_NUM_PARTITIONS: 1
        ports:
          - 9092:9092
        options: >-
          --health-cmd="/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    defaults:
      run:
        working-directory: backend/platform-api
    env:
      THE_APP_KAFKA_IT: 'true'
      THE_APP_KAFKA_BOOTSTRAP_SERVERS: localhost:9092
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify Kafka outbox acknowledgement path
        run: mvn -B -Dtest=KafkaOutboxBrokerIntegrationTest test

  backend-kafka-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: theapp_test
          POSTGRES_USER: theapp
          POSTGRES_PASSWORD: theapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U theapp -d theapp_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      kafka:
        image: apache/kafka:4.0.0
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
          KAFKA_NUM_PARTITIONS: 1
        ports:
          - 9092:9092
        options: >-
          --health-cmd="/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    defaults:
      run:
        working-directory: backend/platform-api
    env:
      THE_APP_KAFKA_POSTGRES_IT: 'true'
      THE_APP_KAFKA_BOOTSTRAP_SERVERS: localhost:9092
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/theapp_test
      SPRING_DATASOURCE_USERNAME: theapp
      SPRING_DATASOURCE_PASSWORD: theapp
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify Kafka-to-PostgreSQL replay and poison-event safety
        run: mvn -B -Dtest=KafkaPostgresDriverMatchingReplayIntegrationTest,KafkaPostgresPoisonEventIntegrationTest test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check JavaScript syntax
        run: node --check frontend/web/app.js
      - name: Verify required frontend files
        run: test -s frontend/web/index.html && test -s frontend/web/styles.css
