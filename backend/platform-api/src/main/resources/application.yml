spring:
  application:
    name: the-app-platform-api
  threads:
    virtual:
      enabled: false
  datasource:
    url: ${THE_APP_DB_URL:jdbc:h2:file:./data/theapp;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${THE_APP_DB_USER:sa}
    password: ${THE_APP_DB_PASSWORD:}
    driver-class-name: ${THE_APP_DB_DRIVER:org.h2.Driver}
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${THE_APP_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5

server:
  shutdown: graceful
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

the-app:
  outbox:
    transport: ${THE_APP_OUTBOX_TRANSPORT:none}
    publisher:
      enabled: ${THE_APP_OUTBOX_PUBLISHER_ENABLED:false}
      poll-delay-ms: ${THE_APP_OUTBOX_POLL_DELAY_MS:1000}
      batch-size: ${THE_APP_OUTBOX_BATCH_SIZE:50}
      lease-seconds: ${THE_APP_OUTBOX_LEASE_SECONDS:30}
      max-attempts: ${THE_APP_OUTBOX_MAX_ATTEMPTS:8}
      base-backoff-seconds: ${THE_APP_OUTBOX_BASE_BACKOFF_SECONDS:2}
  matching:
    consumer:
      enabled: ${THE_APP_MATCHING_CONSUMER_ENABLED:false}
      group-id: ${THE_APP_MATCHING_CONSUMER_GROUP_ID:driver-matching-v1}
      dead-letter-topic: ${THE_APP_MATCHING_DEAD_LETTER_TOPIC:ride.requested.v1.dlt}
      retry-backoff-ms: ${THE_APP_MATCHING_RETRY_BACKOFF_MS:1000}
      max-retries: ${THE_APP_MATCHING_MAX_RETRIES:2}
  kafka:
    send-timeout-seconds: ${THE_APP_KAFKA_SEND_TIMEOUT_SECONDS:10}
    topics:
      ride-requested: ${THE_APP_KAFKA_RIDE_REQUESTED_TOPIC:ride.requested.v1}

info:
  app:
    name: THE APP Platform API
    version: 0.1.0
