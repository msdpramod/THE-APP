spring:
  application:
    name: the-app-platform-api
  threads:
    virtual:
      enabled: false

server:
  shutdown: graceful
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

info:
  app:
    name: THE APP Platform API
    version: 0.1.0
